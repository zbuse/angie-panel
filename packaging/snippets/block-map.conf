#if ($block_request) {return 444;}

# --- http{} Security request filter map ---------------------------------------------
map "$request_uri|$query_string|$http_user_agent" $block_request {
    default 0;
    # --- SQL Injection --------------------------------------------------------
    # UNION [ALL] SELECT
    ~*union([^a-z0-9]|%[0-9a-f][0-9a-f])+(all([^a-z0-9]|%[0-9a-f][0-9a-f])+)?select 1;
    # Time-based blind SQLi: sleep(...) / benchmark(...)
    ~*(sleep|benchmark)(\s|%20)*(\(|%28) 1;
    # --- Path traversal / file disclosure ------------------------------------
    # ../ or ..\ in query string
    ~*(\.\.|%2e%2e)(/|%2f|%5c) 1;
    # Traversal in request path
    ~*(/|%2f)(\.\.|%2e%2e)(/|%2f) 1;
    # Sensitive system files and null byte
    # 敏感文件与环境信息
    ~*(/etc/passwd|/etc/shadow|/proc/|proc/self/environ) 1;
    # 路径穿越，包括分号绕过形式 ..;/
    ~*(\.\.[;/\\]|%2e%2e|%252e%252e) 1;
    # 空字节与编码变体
    ~*(%00|%2500) 1;
    # Vim 交换文件及编辑器备份文件
    ~*(/\.viminfo|\.sw[a-z](?:/|\?|$)|~(?:/|\?|$)|\.(bak|old|orig|save|backup|tmp|temp|un~)(?:/|\?|$)) 1;
    # --- PHP injection --------------------------------------------------------
    # PHP superglobal override
    ~*(globals|_request)(=|\[|%5b) 1;
    # base64 encode/decode
    ~*base64_(en|de)code(\(|%28) 1;
    # PHP configuration injection and php://input
    ~*(allow_url_include|auto_prepend_file|php://input) 1;
    # --- XSS ------------------------------------------------------------------
    # <script> injection
    ~*(<|%3c)\s*script 1;
    # --- Vulnerability scanners ----------------------------------------------
    ~*(sqlmap|nikto|netsparker|acunetix|nessus|openvas|masscan|dirbuster|wpscan|hydra|zgrab|fimap) 1;
    # --- Sensitive files / directories ---------------------------------------
    ~*(^|/)(\.env(\.[^/]*)?|\.git(/|$)|\.gitlab-ci\.yml|\.github(/|$)|\.vscode(/|$)|\.idea(/|$)|composer\.(json|lock)) 1;
    # Block internal project directories and entry points
    ~*^/(app|vendor|config|runtime|think|extend|route)(/|$) 1;
    # Block wordpress scan
    ~*(^|/)wp-[^/]*(/|$) 1;
        # 系统敏感文件
    ~*(/etc/passwd|/etc/shadow|/proc/|proc/self/environ|proc/self/cgroup) 1;

    # 环境变量、认证信息及密钥
    ~*(^|[/;])\.htpasswd(?:[/;?]|$) 1;
    ~*(^|[/;])\.bashrc(?:[/;?]|$) 1;
    ~*(^|[/;])\.amplifyrc(?:[/;?]|$) 1;
    ~*(^|[/;])\.ssh(?:/|$) 1;
    ~*(^|[/;])\.pgpass(?:[/;?]|$) 1;
    ~*(^|[/;])\.gitconfig(?:[/;?]|$) 1;
    ~*(^|[/;])\.boto(?:[/;?]|$) 1;
    ~*(^|[/;])\.dev\.vars(?:[/;?]|$) 1;
    ~*(^|[/;])\.vault-token(?:[/;?]|$) 1;

    # Git 仓库与 Terraform 敏感文件
    ~*(^|[/;])\.git(?:/|$) 1;
    ~*\.auto\.tfvars(?:[/;?]|$) 1;
}