    ~*(ClaudeBot|Amazonbot|GPTBot|BLEXBot|SemrushBot|dotbot|yandex|slurp|duckduckbot|exabot|facebot|ia_archiver|externalagent|facebook) 1;
    ~*(robozilla|MJ12bot|NHN|Twiceler|msnbot|BlackWidow|ChinaClaw|Custo|DISCo|Download|Demon|eCatch|EirGrabber|EmailSiphon|EmailWolf|SuperHTTP|Surfbot|WebWhacker) 1;
    ~*(Express|WebPictures|ExtractorPro|EyeNetIE|FlashGet|GetRight|GetWeb!|Go!Zilla|Go-Ahead-Got-It|GrabNet|Grafula|HMView|Serf) 1;
    ~*(rafula|HTTrack|Stripper|Sucker|Indy|InterGET|Ninja|JetCar|larbin|LeechFTP|Downloader|tool|Navroad|NearSite|NetAnts|tAkeOut|WWWOFFLE) 1;
    ~*(Teleport|VoidEYE|Collector|WebAuto|WebCopier|WebFetch|WebGo|WebLeacher|WebReaper|WebSauger|eXtractor|Quester|WebStripper|WebZIP|Wget|Zeus) 1;
    ~*(dotbot|leakix|Twengabot|htmlparser|libwww|Python|perl|urllib|scan|email|PycURL|Pyth|PyQ|WebCollector|WebCopy|webcraw|Barkrowler|checkmarknetwork|okhttp|serpstatbot) 1;
    ~*(gost|openai|chatgpt|gpt-4|gpt-3\.5|bard|huggingface|anthropic|cohere|ai\-bot|llm\-crawler|language\-model|applebot|AliyunSecBot|AwarioBot|PetalBot|Go\-http\-client|okhttp|python|petalbot|ahrefs|dataforseo) 1;
